name: Sync Portfolio Projects

on:
  schedule:
    - cron: "0 6 * * 1" # Weekly, Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync content/projects/portfolio from the conall-portfolio topic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/sync-portfolio-projects.sh

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: sync content/projects/portfolio from conall-portfolio topic"
          title: "chore: sync portfolio projects"
          body: |
            Automated sync of `content/projects/portfolio/` from repositories tagged with the
            [`conall-portfolio`](https://github.com/topics/conall-portfolio) topic on GitHub.
          branch: automation/sync-portfolio-projects
          delete-branch: true
          add-paths: content/projects/portfolio/**
